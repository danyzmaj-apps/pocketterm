# + on the list with Start omp off: a plain shell opens in the chosen
# project, and the phone lands on its screen page; back on the list it's a
# window row in that folder.
#   env: PROJECT (regex)
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- tapOn: "\n?New session"
- extendedWaitUntil:
    visible:
      id: "start-agent"
    timeout: 10000
- assertVisible: "Start omp(, |\n)Off: just a shell.*"
- runFlow:
    file: sub/switch.yaml
    env:
      ID: start-agent
- takeScreenshot: shell-only
# A project's row: its name, then its full path (the run's projects aren't
# under its home); iOS reads the two joined by ", ".
- scrollUntilVisible:
    element: "${PROJECT}(, |\n).*/${PROJECT}"
    timeout: 20000
- tapOn: "${PROJECT}(, |\n).*/${PROJECT}"
# Below Android 9 the field's hint isn't read: there its Send.
- extendedWaitUntil:
    visible:
      id: "term-input"
    timeout: 45000
- assertNotVisible:
    id: "session-input"
- takeScreenshot: screen
- runFlow: sub/back.yaml
# Its row reads the folder after the program: "zsh · /…/<project>".
- scrollUntilVisible:
    element: ".* · .*/${PROJECT}(\n.*)?"
    timeout: 30000
- takeScreenshot: listed
