# Signs a phone in with the computer's code, pasted where the camera would read
# it (E2E builds only: lib/onboarding/scan.dart), then answers the
# notifications question, asked at every sign-in (leaving a server forgets the
# answer): PUSH=accept turns them on and allows the system's prompt,
# PUSH=decline taps Not now. Ends on the computer's session list.
#   env: LINK, PUSH, COMPUTER
appId: com.danyzmaj.pocketterm
---
- launchApp
- extendedWaitUntil:
    visible: "Scan the code from your computer"
    timeout: 30000
- tapOn: "Scan the code from your computer"
# Below Android 9 Flutter hands a text field's hint to nobody: there the field
# is found by its identifier.
- extendedWaitUntil:
    visible: "Use"
    timeout: 10000
- runFlow:
    when:
      visible: "Paste a code \\(debug\\)"
    commands:
      - tapOn: "Paste a code \\(debug\\)"
- runFlow:
    when:
      notVisible: "Paste a code \\(debug\\)"
    commands:
      - tapOn:
          id: "paste-code"
- inputText: ${LINK}
- tapOn: "Use"
- extendedWaitUntil:
    visible: "Know when a session needs you"
    timeout: 20000
- takeScreenshot: consent
- runFlow:
    when:
      true: ${PUSH == 'accept'}
    commands:
      - tapOn: "Turn on notifications"
      # Android 13+ asks. iOS asks once per install too, but Maestro's iOS
      # driver answers that prompt itself (it allows every permission): a tap
      # of ours after it lands on the session list behind and opens a row.
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                text: "Allow"
                optional: true
- runFlow:
    when:
      true: ${PUSH != 'accept'}
    commands:
      - tapOn: "Not now"
- extendedWaitUntil:
    visible: ${COMPUTER}
    timeout: 20000
- extendedWaitUntil:
    visible: "\n?New session"
    timeout: 20000
- takeScreenshot: home
