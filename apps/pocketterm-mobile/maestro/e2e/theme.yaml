# Account → Theme: each theme in turn (sub/theme_pick.yaml photographs the
# theme picker, the session list and a session in it), the choice still there
# after the app is stopped and started again, and System last, the default the
# phone started on (picked first, it would change nothing). Each theme shows
# its light or dark half as the phone is; run it in both appearances.
#   env: SESSION (regex)
appId: com.danyzmaj.pocketterm
---
- runFlow:
    file: sub/theme_pick.yaml
    env:
      PICK: rosePine
      NAME: rose-pine
- runFlow:
    file: sub/theme_pick.yaml
    env:
      PICK: tokyoNight
      NAME: tokyo-night
- runFlow:
    file: sub/theme_pick.yaml
    env:
      PICK: catppuccin
      NAME: catppuccin
# Kept: stopped and started again, the account sheet still says Catppuccin.
- stopApp
- runFlow: sub/home.yaml
- tapOn:
    id: "account"
- extendedWaitUntil:
    visible:
      text: "Theme(, |\n)Catppuccin"
      id: "theme"
    timeout: 5000
- takeScreenshot: theme-catppuccin-relaunched
- runFlow:
    file: sub/theme_pick.yaml
    env:
      PICK: system
      NAME: system
- stopApp
- runFlow: sub/home.yaml
- tapOn:
    id: "account"
- extendedWaitUntil:
    visible:
      text: "Theme(, |\n)System"
      id: "theme"
    timeout: 5000
- runFlow: sub/close_account.yaml
- extendedWaitUntil:
    notVisible:
      id: "leave-server"
    timeout: 5000
