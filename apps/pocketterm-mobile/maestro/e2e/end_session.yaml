# Swipe left on a session's row, End session (the swipe was the asking: it
# ends at once): its window closes on the computer and the row goes.
#   env: SESSION (regex)
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- scrollUntilVisible:
    element: "${SESSION}\n.*"
    timeout: 20000
- swipe:
    from: "${SESSION}\n.*"
    direction: LEFT
- tapOn: "End session"
- takeScreenshot: ending
- extendedWaitUntil:
    notVisible: "${SESSION}\n.*"
    timeout: 30000
- takeScreenshot: ended
