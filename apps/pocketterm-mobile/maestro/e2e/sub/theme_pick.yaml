# Account → Theme → PICK, from a relaunched app; then the theme picker, the
# session list and SESSION's page are photographed in it (theme-<NAME>-*).
# iOS confirms the new home screen icon with an alert of its own: OK (System
# and Catppuccin share the app's own icon: no alert between them). The picker
# shows when its System row does. iOS: the account sheet's Theme page (Back,
# then the sheet's Done); Android: a sheet over Settings.
#   env: PICK (the theme's name: system, catppuccin, rosePine, tokyoNight),
#        NAME (screenshot name), SESSION (regex)
appId: com.danyzmaj.pocketterm
---
- runFlow: home.yaml
- tapOn:
    id: "account"
- extendedWaitUntil:
    visible:
      id: "theme"
    timeout: 5000
- tapOn:
    id: "theme"
- extendedWaitUntil:
    visible:
      id: "theme-system"
    timeout: 5000
- tapOn:
    id: "theme-${PICK}"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: ".*changed the icon.*"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: ".*changed the icon.*"
          commands:
            # Not tapped again where OK was (Maestro repeats a tap after which it
            # sees no change): with the alert gone, that would pick another theme.
            - tapOn:
                text: "OK"
                retryTapIfNoChange: false
- waitForAnimationToEnd
- takeScreenshot: theme-${NAME}-sheet
# The theme picker, then the account sheet (Settings) under it.
- runFlow: close_picker.yaml
- extendedWaitUntil:
    notVisible:
      id: "theme-.+"
    timeout: 5000
- runFlow: close_account.yaml
- extendedWaitUntil:
    notVisible:
      id: "leave-server"
    timeout: 5000
- assertVisible: "\n?New session"
- takeScreenshot: theme-${NAME}-list
- runFlow:
    file: open_row.yaml
    env:
      ROW: ${SESSION}
- takeScreenshot: theme-${NAME}-session
- runFlow: back.yaml
