name: pocketterm_workspace
description: "PocketTerm: the workspace of the Dart server and the end-to-end harness (the apps are native)."
publish_to: 'none'

environment:
  sdk: ^3.13.4

workspace:
  - packages/pocketterm_server
  - apps/pocketterm-server
  - tool/e2e

# The shared analysis_options.yaml includes very_good_analysis.
dev_dependencies:
  very_good_analysis: ^11.0.0
