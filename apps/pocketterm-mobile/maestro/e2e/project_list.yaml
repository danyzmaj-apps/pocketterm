# The list's projects: a tap on the sort pill switches between Name and
# Recent activity (another tap back, as kept); tapping a project's heading
# folds it to a count of its sessions and unfolds it again; long-pressing it
# offers Fold all others, then Unfold all. Everything is left as it was found.
#   env: PROJECT (regex: a project with sessions; its heading reads it in
#   capitals, and Maestro matches text ignoring case)
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
# The pill reads its choice (with its tooltip, Sort projects, after a line
# break where the platform reads tooltips so).
- extendedWaitUntil:
    visible: "(Name|Recent activity)(\nSort projects)?"
    timeout: 10000
- takeScreenshot: sort
- runFlow:
    when:
      visible: "Name(\nSort projects)?"
    commands:
      - tapOn:
          id: "project-sort"
      - extendedWaitUntil:
          visible: "Recent activity(\nSort projects)?"
          timeout: 5000
      - takeScreenshot: sorted-other
      - tapOn:
          id: "project-sort"
      - extendedWaitUntil:
          visible: "Name(\nSort projects)?"
          timeout: 5000
# After the block above it reads Name, so this one runs only when it started
# on Recent activity.
- runFlow:
    when:
      visible: "Recent activity(\nSort projects)?"
    commands:
      - tapOn:
          id: "project-sort"
      - extendedWaitUntil:
          visible: "Name(\nSort projects)?"
          timeout: 5000
      - takeScreenshot: sorted-other
      - tapOn:
          id: "project-sort"
      - extendedWaitUntil:
          visible: "Recent activity(\nSort projects)?"
          timeout: 5000
# Fold and unfold by its heading; its session's row goes and comes back.
- scrollUntilVisible:
    element: "${PROJECT}"
    timeout: 20000
- tapOn: "${PROJECT}"
- extendedWaitUntil:
    notVisible: "${PROJECT}\n.*"
    timeout: 5000
- assertVisible: "[0-9]+ sessions?( · .*)?"
- takeScreenshot: folded
- tapOn: "${PROJECT}"
- extendedWaitUntil:
    visible: "${PROJECT}\n.*"
    timeout: 5000
# Its menu: fold the others, then unfold all.
- longPressOn: "${PROJECT}"
- extendedWaitUntil:
    visible: "Fold all others"
    timeout: 5000
- takeScreenshot: menu
- tapOn: "Fold all others"
- extendedWaitUntil:
    visible: "[0-9]+ sessions?( · .*)?"
    timeout: 5000
- assertVisible: "${PROJECT}\n.*"
- takeScreenshot: others-folded
- scrollUntilVisible:
    element: "${PROJECT}"
    timeout: 20000
- longPressOn: "${PROJECT}"
- extendedWaitUntil:
    visible: "Unfold all"
    timeout: 5000
- tapOn: "Unfold all"
- extendedWaitUntil:
    notVisible: "[0-9]+ sessions?( · .*)?"
    timeout: 5000
- assertVisible: "${PROJECT}\n.*"
- takeScreenshot: unfolded
