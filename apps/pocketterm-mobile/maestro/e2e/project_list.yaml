# The list's projects: the sort control switches between Name and Recent
# activity (and back, as kept); tapping a project's heading folds it to a
# count of its sessions and unfolds it again; long-pressing it offers Fold all
# others, then Unfold all. Everything is left as it was found.
#   env: PROJECT (regex: a project with sessions; its heading reads its name,
#   as does its session's row, so each is found by its id too)
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
# The control reads its choice.
- extendedWaitUntil:
    visible:
      text: "(Name|Recent activity)"
      id: "project-sort"
    timeout: 10000
- takeScreenshot: sort
- runFlow:
    when:
      visible:
        text: "Name"
        id: "project-sort"
    commands:
      - runFlow:
          file: sub/sort.yaml
          env:
            TO: Recent activity
      - takeScreenshot: sorted-other
      - runFlow:
          file: sub/sort.yaml
          env:
            TO: Name
# After the block above it reads Name, so this one runs only when it started
# on Recent activity.
- runFlow:
    when:
      visible:
        text: "Recent activity"
        id: "project-sort"
    commands:
      - runFlow:
          file: sub/sort.yaml
          env:
            TO: Name
      - takeScreenshot: sorted-other
      - runFlow:
          file: sub/sort.yaml
          env:
            TO: Recent activity
# Fold and unfold by its heading (in the middle: at the bottom it sits under the orchestrator's bar); its
# session's row goes and comes back.
- scrollUntilVisible:
    element:
      text: "${PROJECT}"
      id: "project-.*"
    centerElement: true
    timeout: 20000
- tapOn:
    text: "${PROJECT}"
    id: "project-.*"
- extendedWaitUntil:
    notVisible:
      text: "${PROJECT}(\n.*)*"
      id: "session-.*"
    timeout: 5000
- assertVisible: "[0-9]+ sessions?( · .*)?"
- takeScreenshot: folded
- tapOn:
    text: "${PROJECT}"
    id: "project-.*"
- extendedWaitUntil:
    visible:
      text: "${PROJECT}(\n.*)*"
      id: "session-.*"
    timeout: 5000
# Its menu: fold the others, then unfold all.
- runFlow:
    file: sub/project_menu.yaml
- extendedWaitUntil:
    visible: "Fold all others"
    timeout: 5000
- takeScreenshot: menu
- tapOn: "Fold all others"
- extendedWaitUntil:
    visible: "[0-9]+ sessions?( · .*)?"
    timeout: 5000
- assertVisible:
    text: "${PROJECT}(\n.*)*"
    id: "session-.*"
- takeScreenshot: others-folded
- scrollUntilVisible:
    element:
      text: "${PROJECT}"
      id: "project-.*"
    centerElement: true
    timeout: 20000
- runFlow:
    file: sub/project_menu.yaml
- extendedWaitUntil:
    visible: "Unfold all"
    timeout: 5000
- tapOn: "Unfold all"
- extendedWaitUntil:
    notVisible: "[0-9]+ sessions?( · .*)?"
    timeout: 5000
- assertVisible:
    text: "${PROJECT}(\n.*)*"
    id: "session-.*"
- takeScreenshot: unfolded
