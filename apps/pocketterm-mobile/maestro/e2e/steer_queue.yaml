# While the agent works: a prompt steers it at once (shown right away, and
# the agent says it took it when the run ends), and with Queue on a prompt
# waits in the queue above the field for the run to end and then runs on its own.
#   env: SESSION (regex), SLOW, STEER, STEER_RE, QUEUE, QUEUE_RE
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- runFlow:
    file: sub/open_row.yaml
    env:
      ROW: ${SESSION}
# Below Android 9 the field's hint isn't read (sub/prompt.yaml): there Send, its tooltip after a line break.
- extendedWaitUntil:
    visible:
      id: "session-input"
    timeout: 15000
- runFlow: sub/prompt.yaml
- inputText: ${SLOW}
- tapOn:
    id: "session-send"
# Working: Stop shows, and the empty field offers to steer.
- extendedWaitUntil:
    visible:
      id: "stop"
    timeout: 15000
- extendedWaitUntil:
    visible: "Steer omp…"
    timeout: 10000
- takeScreenshot: working
# The hint changed, so the field is found by its identifier.
- tapOn:
    id: "session-input"
- inputText: ${STEER}
- tapOn:
    id: "session-send"
# Sent once the field is empty again; the steer shows while the run goes on.
- extendedWaitUntil:
    visible: "Steer omp…"
    timeout: 10000
- extendedWaitUntil:
    visible: "${STEER_RE}"
    timeout: 10000
- assertVisible:
    id: "stop"
- takeScreenshot: steered
# Queue on: the next prompt waits for the run to end.
- tapOn:
    id: "follow-up"
- extendedWaitUntil:
    visible: "Queue a prompt…"
    timeout: 10000
- takeScreenshot: queue-on
- tapOn:
    id: "session-input"
- inputText: ${QUEUE}
- tapOn:
    id: "session-send"
- extendedWaitUntil:
    visible:
      id: "queue-strip"
    timeout: 15000
- takeScreenshot: queued
- extendedWaitUntil:
    visible: ".*fake steered: ${STEER_RE}.*"
    timeout: 90000
# The queued prompt runs and the agent goes idle. Right after the run's end
# the screen changes fast (the reply streams, Working… animates), and a read
# of it can come back failed at once, which fails a wait without waiting:
# the checks go again then.
- retry:
    maxRetries: 3
    commands:
      - extendedWaitUntil:
          visible: ".*fake reply: ${QUEUE_RE}.*"
          timeout: 30000
      - extendedWaitUntil:
          notVisible:
            id: "stop"
          timeout: 30000
- takeScreenshot: queued-ran
- runFlow: sub/back.yaml
