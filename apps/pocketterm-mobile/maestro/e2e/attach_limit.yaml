# A message takes at most 10 images and files: 10 photos picked at once (run.sh
# adds 10 to the library) all attach, and then the attach button offers
# nothing more. All are removed again; nothing is sent.
#   env: SESSION (regex)
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- runFlow:
    file: sub/open_row.yaml
    env:
      ROW: ${SESSION}
- extendedWaitUntil:
    visible:
      id: "session-input"
    timeout: 15000
- runFlow:
    file: sub/attach_pick.yaml
    env:
      PICK: "Choose from Photos"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Select up to 10 photos\\."
          timeout: 15000
      # Single photos read "Photo, <date>, <time>", newest first; the pattern
      # takes a picked one too, so the indexes stay put.
      - tapOn:
          text: "Photo, [^,]+, [0-9:]+.*"
          index: 0
      - tapOn:
          text: "Photo, [^,]+, [0-9:]+.*"
          index: 1
      - tapOn:
          text: "Photo, [^,]+, [0-9:]+.*"
          index: 2
      - tapOn:
          text: "Photo, [^,]+, [0-9:]+.*"
          index: 3
      - tapOn:
          text: "Photo, [^,]+, [0-9:]+.*"
          index: 4
      - tapOn:
          text: "Photo, [^,]+, [0-9:]+.*"
          index: 5
      - tapOn:
          text: "Photo, [^,]+, [0-9:]+.*"
          index: 6
      - tapOn:
          text: "Photo, [^,]+, [0-9:]+.*"
          index: 7
      - tapOn:
          text: "Photo, [^,]+, [0-9:]+.*"
          index: 8
      - tapOn:
          text: "Photo, [^,]+, [0-9:]+.*"
          index: 9
      - takeScreenshot: picker
      - tapOn: "Done"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*(Photo|Photos|Select|images).*"
          timeout: 15000
      # Google Photos' banner over the grid would push the tenth photo under
      # the bar that comes with the first pick (a tap there is "View
      # selected", a preview): dismissed first.
      - tapOn:
          id: "com.google.android.providers.media.module:id/dismiss_button"
          optional: true
      # The system photo picker, newest first; its button counts the picks,
      # "Add (10)".
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 0
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 1
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 2
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 3
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 4
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 5
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 6
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 7
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 8
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 9
      - takeScreenshot: picker
      - tapOn: "(Done|Add|Select) \\(10\\)"
# Each image its own ✕, ten of them; no eleventh.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "Remove image"
            index: 9
          timeout: 30000
      - assertNotVisible:
          text: "Remove image"
          index: 10
# iOS reads only the thumbnails on screen: scroll the strip to its end.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "attachment-remove-0"
          timeout: 30000
      - repeat:
          times: 3
          while:
            notVisible:
              id: "attachment-remove-9"
          commands:
            - swipe:
                from:
                  id: "attachment-strip"
                direction: LEFT
      - extendedWaitUntil:
          visible:
            id: "attachment-remove-9"
          timeout: 10000
      - assertNotVisible:
          id: "attachment-remove-10"
- takeScreenshot: ten-attached
# Full: the attach button opens no menu.
- tapOn: "\n?Attach images or files"
- assertNotVisible: "Choose from Photos"
- takeScreenshot: full
# iOS: back to the strip's start first; the first one scrolled half out of
# view can't be tapped. Each ✕ in turn then, the first each time.
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 3
          while:
            notVisible:
              id: "attachment-remove-0"
          commands:
            - swipe:
                from:
                  id: "attachment-strip"
                direction: RIGHT
- repeat:
    times: 12
    while:
      visible: "Remove image"
    commands:
      - tapOn:
          text: "Remove image"
          index: 0
- assertNotVisible: "Remove image"
- takeScreenshot: removed
- runFlow: sub/back.yaml
