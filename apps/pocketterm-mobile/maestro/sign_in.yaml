# Signs the app in with a code from the computer, a phone's only way in:
# pastes SETUP_LINK (a reviewer code's link from Settings → Reviewer access,
# or a fresh Settings → Set up phone… code) into "Paste a code instead". Does
# nothing when the app is signed in already, so it's safe in a full run.
#   maestro test -e SETUP_LINK='pocketterm://setup?url=…&key=…&code=…' sign_in.yaml
appId: com.danyzmaj.pocketterm
---
- launchApp
# A signed-in app opens on its Terminal list.
- extendedWaitUntil:
    visible: "Terminal"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Scan the code from your computer"
    commands:
      - tapOn: "Paste a code instead"
      - tapOn: "pocketterm://setup.*"
      - inputText: ${SETUP_LINK}
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Terminal"
    timeout: 20000
