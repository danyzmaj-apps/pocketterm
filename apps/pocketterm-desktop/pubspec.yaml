name: pocketterm_desktop
description: "PocketTerm: this computer's coding sessions and terminals on your phone, through your own PocketTerm server."
publish_to: 'none'
version: 0.1.7+22
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.7
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  http: ^1.5.0
  launch_at_startup: ^0.5.1
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pocketterm_core: any
  pocketterm_server: any
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  tray_manager: ^0.8.0
  url_launcher: ^6.3.3
  win32: ^5.15.0
  win32_registry: ^2.1.0
  window_manager: ^0.5.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  pocketterm_e2e: any
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    # The coding agents' PocketTerm integrations, for Settings to install
    # (lib/integrations.dart). Claude Code's plugin without its tests/.
    - integrations/omp/
    - integrations/claude/.claude-plugin/
    - integrations/claude/plugins/pocketterm/.claude-plugin/
    - integrations/claude/plugins/pocketterm/hooks/
    # The tray item on Windows (lib/windows_host.dart), made from the app icon
    # like windows/runner/resources/app_icon.ico.
    - assets/tray.ico
    # Each other theme's app icon while PocketTerm runs (lib/desktop_host.dart's setAppIcon; Catppuccin Mocha's
    # is the app's own), made by tool/make_icon.swift: the Dock's on macOS, the window's and the tray item's on
    # Windows.
    - path: assets/icon/macos-dawn.png
      platforms: [macos]
    - path: assets/icon/macos-tokyoNight.png
      platforms: [macos]
    - path: assets/icon/macos-gruvbox.png
      platforms: [macos]
    - path: assets/icon/windows-default.ico
      platforms: [windows]
    - path: assets/icon/windows-dawn.ico
      platforms: [windows]
    - path: assets/icon/windows-tokyoNight.ico
      platforms: [windows]
    - path: assets/icon/windows-gruvbox.ico
      platforms: [windows]
    - path: assets/icon/tray-dawn.ico
      platforms: [windows]
    - path: assets/icon/tray-tokyoNight.ico
      platforms: [windows]
    - path: assets/icon/tray-gruvbox.ico
      platforms: [windows]
    # PocketTerm on Supabase: what the setup puts on a project (lib/onboarding/supabase_setup.dart).
    - supabase/migrations/
    - supabase/functions/pocketterm/

# `swift tool/make_icon.swift && fvm dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: false
  ios: false
  macos:
    generate: true
    image_path: assets/icon/macos.png
