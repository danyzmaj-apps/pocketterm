name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [Mac app, iPhone app, Android app, Widget, Notifications / push, Backend setup, Pairing a phone, Quick questions (AI), Terminal from phone, omp / Claude Code integration]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: PocketTerm version (Mac → PocketTerm → About PocketTerm; phone → its TestFlight or Google Play page), macOS / iOS / Android version, phone model.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Any message the app showed. Leave out your project URL, keys and tokens.
