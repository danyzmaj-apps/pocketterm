name: test-server-deploy

# PocketTerm's test server (apps/pocketterm-server) on danyzmaj-server, at https://pocketterm-test.danyzmaj.com,
# for the E2E runs. Manual only: Actions -> test-server-deploy -> Run workflow, on the branch to deploy.
on:
  workflow_dispatch:

jobs:
  deploy:
    uses: danyzmaj-apps/danyzmaj-server/.github/workflows/deploy-app.yml@master
    with:
      app: pocketterm-test
      compose-file: apps/pocketterm-server/deploy/compose.yaml
