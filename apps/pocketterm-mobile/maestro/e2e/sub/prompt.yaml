# Taps the conversation's prompt field, by its identifier (both apps).
appId: com.danyzmaj.pocketterm
---
- tapOn:
    id: "session-input"
# A cold-booted emulator's Gboard shows its "Tap to Google Search and more"
# hint over the composer the first time the keyboard comes up: closed.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "com.google.android.inputmethod.latin:id/access_points_hint_close_button"
          timeout: 2000
          optional: true
      - runFlow:
          when:
            visible:
              id: "com.google.android.inputmethod.latin:id/access_points_hint_close_button"
          commands:
            - tapOn:
                id: "com.google.android.inputmethod.latin:id/access_points_hint_close_button"
