name: pocketterm_desktop
description: "PocketTerm: this computer's coding sessions and terminals on your phone, through Supabase."
publish_to: 'none'
version: 0.1.0+7
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.7
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.5.0
  launch_at_startup: ^0.5.1
  package_info_plus: ^9.0.1
  path: ^1.9.1
  pocketterm_core: any
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.0
  tray_manager: ^0.8.0
  url_launcher: ^6.3.3
  win32: ^5.15.0
  win32_registry: ^2.1.0
  window_manager: ^0.5.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # The backend, for the in-app setup (lib/onboarding/): it applies these to
  # the user's Supabase project.
  assets:
    - supabase/migrations/
    - supabase/functions/pair/
    - supabase/functions/push/
    # The coding agents' PocketTerm integrations, for Settings to install
    # (lib/integrations.dart). Claude Code's plugin without its tests/.
    - integrations/omp/
    - integrations/claude/.claude-plugin/
    - integrations/claude/plugins/pocketterm/.claude-plugin/
    - integrations/claude/plugins/pocketterm/hooks/
    # The tray item on Windows (lib/windows_host.dart), made from the app icon
    # like windows/runner/resources/app_icon.ico.
    - assets/tray.ico

# `swift tool/make_icon.swift && fvm dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: false
  ios: false
  macos:
    generate: true
    image_path: assets/icon/macos.png
