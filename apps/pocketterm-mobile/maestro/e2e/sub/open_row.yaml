# Opens the list row titled ROW (a regex): a session's (session-<key>) or a
# window's (term-<key>), not the project heading of the same name; scrolled to
# the middle first: at the bottom of the screen it sits under the
# orchestrator's bar or the +, and the tap opened those instead.
# Android: centering can't be had on a list that barely scrolls (Maestro then
# swipes on past the row, which slides under its project's sticky heading and
# is lost); the row is scrolled into view, and nudged up once when it sits low,
# under the bar.
appId: com.danyzmaj.pocketterm
---
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            text: "${ROW}(\n.*)*"
            id: "(session|term)-.*"
          centerElement: true
          timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            text: "${ROW}(\n.*)*"
            id: "(session|term)-.*"
          timeout: 20000
      - runFlow:
          when:
            notVisible:
              text: "${ROW}(\n.*)*"
              id: "(session|term)-.*"
              above:
                id: "orchestrator-bar"
          commands:
            - swipe:
                start: 50%, 60%
                end: 50%, 40%
                duration: 600
            - waitForAnimationToEnd:
                timeout: 2000
- tapOn:
    text: "${ROW}(\n.*)*"
    id: "(session|term)-.*"
# A tap while the list still moves (a row's age refreshed) can be lost: tapped
# again only once the page clearly didn't open (the row still there).
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        text: "${ROW}(\n.*)*"
        id: "(session|term)-.*"
    commands:
      - tapOn:
          text: "${ROW}(\n.*)*"
          id: "(session|term)-.*"
- waitForAnimationToEnd
# Android: Maestro's "above" compares tops, so a row whose middle sits under
# the floating orchestrator bar passes the check above, and the tap opens the
# orchestrator. Then it's closed, the list nudged up and the row tapped again.
- runFlow:
    when:
      platform: Android
      visible:
        id: "orchestrator-sheet"
    commands:
      - tapOn:
          id: "orchestrator-close"
      - swipe:
          start: 50%, 60%
          end: 50%, 40%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "${ROW}(\n.*)*"
          id: "(session|term)-.*"
      - waitForAnimationToEnd
