# + on the list: a new agent session in the chosen project, opened in the
# terminal the computer is set to; it then shows in that project.
#   env: PROJECT (regex), TERMINAL_RE
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- tapOn: "New session"
# Where it goes: in that terminal, as a tab in the project's window (the computer's default).
- extendedWaitUntil:
    visible: "Opens in ${TERMINAL_RE}, as a tab in the project's window"
    timeout: 10000
- assertVisible: "Start omp\n.*"
# General (the home folder) comes first, for a session about nothing in particular.
- assertVisible: "General\n~"
- takeScreenshot: sheet
# Each project is a tile: its name, its path under it (the run's projects
# aren't under its home, so the full path); open windows' folders come first,
# so it may be further down.
- scrollUntilVisible:
    element: "${PROJECT}\n.*/${PROJECT}"
    timeout: 20000
- tapOn: "${PROJECT}\n.*/${PROJECT}"
- extendedWaitUntil:
    visible: "Prompt omp…"
    timeout: 45000
- takeScreenshot: started
- tapOn: "Back"
- extendedWaitUntil:
    visible: "${PROJECT}\n.*"
    timeout: 20000
- takeScreenshot: listed
