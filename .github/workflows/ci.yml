name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read the code, nothing else: no job here needs to write to the repo.
permissions:
  contents: read

# Third-party actions are pinned to commits (the tag they were is beside each).
jobs:
  dart:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        member: [packages/pocketterm_core, apps/pocketterm-desktop, apps/pocketterm-mobile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: flutter pub get
      - working-directory: ${{ matrix.member }}
        run: dart format -l 120 --set-exit-if-changed lib test
      - working-directory: ${{ matrix.member }}
        run: flutter analyze
      - working-directory: ${{ matrix.member }}
        run: flutter test

  # The server (pure Dart, no Flutter): its package with the HTTP/WebSocket tests, the command, and its image.
  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: [packages/pocketterm_server, apps/pocketterm-server]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      # The workspace's Dart comes with its Flutter.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: flutter pub get
      - if: matrix.member == 'packages/pocketterm_server'
        working-directory: ${{ matrix.member }}
        run: dart format -l 120 --set-exit-if-changed lib test
      - if: matrix.member == 'apps/pocketterm-server'
        working-directory: ${{ matrix.member }}
        run: dart format -l 120 --set-exit-if-changed bin
      - working-directory: ${{ matrix.member }}
        run: dart analyze --fatal-infos
      - if: matrix.member == 'packages/pocketterm_server'
        working-directory: ${{ matrix.member }}
        run: dart test
      - if: matrix.member == 'apps/pocketterm-server'
        run: docker build -f apps/pocketterm-server/Dockerfile -t pocketterm-server .

  # The shared code and the desktop app on Windows: analyze, the tests that don't need a POSIX
  # system (tag posix: /bin/sh, unix sockets, chmod…), and a debug build of the Windows app.
  dart-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        member: [packages/pocketterm_core, apps/pocketterm-desktop]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: fvm
        run: echo "flutter=$((Get-Content .fvmrc | ConvertFrom-Json).flutter)" >> $env:GITHUB_OUTPUT
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: flutter pub get
      - working-directory: ${{ matrix.member }}
        run: flutter analyze
      - working-directory: ${{ matrix.member }}
        run: flutter test --exclude-tags posix
      - if: matrix.member == 'apps/pocketterm-desktop'
        working-directory: ${{ matrix.member }}
        run: flutter build windows --debug

  # The omp extension the desktop app installs, against omp's and Bun's types.
  omp-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pocketterm-desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno check --config integrations/omp-check.json integrations/omp/*.ts

  # The Claude Code plugin the desktop app installs: its tests (the ping proof PocketTerm checks, the frames the
  # phone gets) in Claude Code's own mod test runner, which needs no sign-in, and its manifest. The hooks module's
  # API types exist only once a signed-in Claude Code has loaded the plugin, so only the self-contained helpers
  # (items.ts) are type-checked. Claude Code is pinned to the version the tests were written against.
  claude-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pocketterm-desktop/integrations/claude/plugins/pocketterm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno check --no-config hooks/items.ts
      - run: curl -fsSL https://claude.ai/install.sh | bash -s 2.1.305
      - run: ~/.local/bin/claude plugin validate --strict .
      - run: ~/.local/bin/claude plugin test .

  # The push relay (apps/pocketterm-relay): requests the Dart server seals must open in the relay, so the
  # vectors are made fresh by the server package first, then the relay's tests run against them.
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: flutter pub get
      - working-directory: packages/pocketterm_server
        run: dart run tool/relay_vectors.dart ../../apps/pocketterm-relay/tests/vectors.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - working-directory: apps/pocketterm-relay
        run: deno fmt --check && deno check main.ts tests/*.ts && deno task test
      - run: docker build -t pocketterm-relay apps/pocketterm-relay
