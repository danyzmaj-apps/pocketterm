# Taps the conversation's prompt field. Below Android 9 Flutter hands a text
# field's hint to nobody: there it's found by its identifier.
appId: com.danyzmaj.pocketterm
---
- runFlow:
    when:
      visible: "Prompt omp…"
    commands:
      - tapOn: "Prompt omp…"
- runFlow:
    when:
      notVisible: "Prompt omp…"
    commands:
      - tapOn:
          id: "session-input"
# A cold-booted emulator's Gboard shows its "Tap to Google Search and more"
# hint over the composer the first time the keyboard comes up: closed.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "com.google.android.inputmethod.latin:id/access_points_hint_close_button"
          timeout: 2000
          optional: true
      - runFlow:
          when:
            visible:
              id: "com.google.android.inputmethod.latin:id/access_points_hint_close_button"
          commands:
            - tapOn:
                id: "com.google.android.inputmethod.latin:id/access_points_hint_close_button"
