name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [Mac app, Windows app, iPhone app, Android app, Notifications / push / Live Activities, Backend setup, Pairing a phone, Several computers, Terminal from phone, omp / Claude Code integration]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: PocketTerm version (Mac → PocketTerm → About PocketTerm; Windows → Settings → Apps → Installed apps; phone → its TestFlight or Google Play page), macOS / Windows / iOS / Android version, phone model, and the terminal (kitty, WezTerm, …).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Any message the app showed. Leave out your project URL, keys and tokens.
