# First-use tips, turned back on (Show tips again), come one at a time in
# their order and only once: the list's, then a conversation's; after a
# relaunch none comes back.
#   env: SESSION (regex), SCREEN (yes: the conversation has a Screen button)
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- tapOn: "Account"
- tapOn: "Show tips again"
# Android's taller rows put the switchable windows below the fold: the tour waits there (no other tip shows
# first), and once it's seen the New session button's tip is the next in view; the list's own come back
# into view above.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Tap to fold this project. (Long-press for|Its ⋯ has) its menu."
          timeout: 3000
          optional: true
      - assertNotVisible: "Tap to fold this project. (Long-press for|Its ⋯ has) its menu."
      - scrollUntilVisible:
          element: "This session shows only its screen. Tap it to open."
          direction: DOWN
          timeout: 30000
- extendedWaitUntil:
    visible: "This session shows only its screen. Tap it to open."
    timeout: 10000
- takeScreenshot: tip-switch
- tapOn: "Got it"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Start your agent or a shell in any project."
          timeout: 10000
      - takeScreenshot: tip-new
      - tapOn: "Got it"
      # Back to the top (the windows button heads the list), where the first project's heading is.
      - scrollUntilVisible:
          element: ".*windows? · .*"
          direction: UP
          timeout: 30000
- extendedWaitUntil:
    visible: "Tap to fold this project. (Long-press for|Its ⋯ has) its menu."
    timeout: 10000
- takeScreenshot: tip-project
- tapOn: "Got it"
- extendedWaitUntil:
    visible: "Swipe left to end the session or close the window."
    timeout: 10000
- tapOn: "Got it"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Start your agent or a shell in any project."
          timeout: 10000
      - takeScreenshot: tip-new
      - tapOn: "Got it"
- runFlow:
    file: sub/open_row.yaml
    env:
      ROW: ${SESSION}
- extendedWaitUntil:
    visible: "Type / for slash commands."
    timeout: 10000
- tapOn: "Got it"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Follow this session on your Lock Screen."
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Follow this session in your notifications."
          timeout: 10000
- tapOn: "Got it"
# No Screen button (so no tip for it) where the terminal can't share its
# screen (Ghostty).
- runFlow:
    when:
      true: ${SCREEN == 'yes'}
    commands:
      - extendedWaitUntil:
          visible: "See the raw terminal screen."
          timeout: 10000
      - takeScreenshot: tip-screen
      - tapOn: "Got it"
- runFlow: sub/back.yaml
- stopApp
- launchApp:
    arguments:
      POCKETTERM_E2E: "true"
- extendedWaitUntil:
    visible: "New session"
    timeout: 30000
- extendedWaitUntil:
    visible: "Got it"
    timeout: 4000
    optional: true
- assertNotVisible: "Got it"
- runFlow:
    file: sub/open_row.yaml
    env:
      ROW: ${SESSION}
- extendedWaitUntil:
    visible: "Got it"
    timeout: 4000
    optional: true
- assertNotVisible: "Got it"
- runFlow: sub/back.yaml
