# Swipe left on a plain shell window's row, Close window (the swipe was the
# asking: it closes at once): the window closes on the computer and the row
# goes. The row is scrolled to the middle first: at the bottom of the screen its
# Close window sits under the + button, and the tap opened New session instead.
#   env: WINDOW (regex)
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- scrollUntilVisible:
    element: "${WINDOW}\n.*"
    centerElement: true
    timeout: 20000
- swipe:
    from: "${WINDOW}\n.*"
    direction: LEFT
- tapOn: "Close window"
- takeScreenshot: closing
# The row gone under a sheet the tap opened isn't the row closed.
- assertNotVisible: "Find a project, or type ~/path"
- extendedWaitUntil:
    notVisible: "${WINDOW}\n.*"
    timeout: 30000
- takeScreenshot: closed
