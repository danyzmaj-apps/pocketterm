# The account sheet: its rows are there (notifications, tips, the source
# link, which isn't tapped), Leave this server asks first and Cancel keeps
# the sign-in; the sheet closes. (iOS 26 asks in a popover by the button,
# without a Cancel: a tap beside it is the cancel.)
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- tapOn:
    id: "account"
- extendedWaitUntil:
    visible: "(.*, )?Signed in with your computer’s code"
    timeout: 5000
- assertVisible: "Notifications((, |\n).*)?"
# Android's Settings is a full page: the rows below are further down.
- scrollUntilVisible:
    element:
      id: "leave-server"
    timeout: 20000
- assertVisible: "Show tips again"
- assertVisible: "PocketTerm is open source: GitHub"
- takeScreenshot: account
- tapOn:
    id: "leave-server"
- extendedWaitUntil:
    visible: "Leave this server\\?"
    timeout: 5000
- takeScreenshot: asking
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      notVisible: "Cancel"
    commands:
      - tapOn:
          point: "50%,12%"
- extendedWaitUntil:
    notVisible: "Leave this server\\?"
    timeout: 5000
# Still signed in, the sheet still open.
- assertVisible:
    id: "leave-server"
- runFlow: sub/close_account.yaml
- extendedWaitUntil:
    notVisible:
      id: "leave-server"
    timeout: 5000
- assertVisible: "\n?New session"
- takeScreenshot: closed
