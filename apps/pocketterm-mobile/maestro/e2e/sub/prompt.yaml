# Taps the conversation's prompt field. Below Android 9 Flutter hands a text
# field's hint to nobody (and reads a button's tooltip after a line break):
# there it's the field between Attach images and Send.
appId: com.danyzmaj.pocketterm
---
- runFlow:
    when:
      visible: "Prompt omp…"
    commands:
      - tapOn: "Prompt omp…"
- runFlow:
    when:
      notVisible: "Prompt omp…"
    commands:
      - tapOn:
          rightOf: "\n?Attach images"
          leftOf: "\n?Send"
