# The iPhone app, its Live Activity widget and its push notification extension. The source of
# PocketTerm.xcodeproj: run `xcodegen generate` here after changing this file (the .xcodeproj is
# git-ignored). Who signs it and which ids it uses come from config/PocketTerm.xcconfig.
name: PocketTerm
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
fileGroups:
  - project.yml
  - UX-NOTES.md
packages:
  PocketTermKit:
    path: ../../../packages/PocketTermKit
settings:
  base:
    # The version the store shows, and the build number every upload raises (release scripts bump these).
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 22
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: $(POCKETTERM_TEAM)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  PocketTerm:
    type: application
    platform: iOS
    configFiles:
      Debug: ../../../config/PocketTerm.xcconfig
      Release: ../../../config/PocketTerm.xcconfig
    sources:
      - path: PocketTerm
      - path: Shared
    dependencies:
      - package: PocketTermKit
        product: PocketTermKit
      - target: PocketTermLive
      - target: PocketTermPush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKETTERM_BUNDLE_ID)
        PRODUCT_NAME: PocketTerm
        INFOPLIST_FILE: PocketTerm/Info.plist
        CODE_SIGN_ENTITLEMENTS: PocketTerm/PocketTerm.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The theme icons (AppIcon-<Theme>). AppIcon-Mocha and AppIcon-Gruvbox are retired but must stay: phones
        # that picked them can't install an update without them. AppIcon-Gruvbox now holds the app's own picture
        # (Gruvbox is gone, its people are on Catppuccin); AppIcons.swift moves such a phone to the app's own icon.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Mocha AppIcon-Dawn AppIcon-TokyoNight AppIcon-Gruvbox
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          # Debug builds carry the test hooks (E2E.swift); they only switch on with the POCKETTERM_E2E launch
          # argument or environment variable, as the Flutter app's --dart-define did.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG POCKETTERM_E2E
    scheme:
      testTargets:
        - PocketTermTests
      gatherCoverageData: false
  PocketTermLive:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: ../../../config/PocketTerm.xcconfig
      Release: ../../../config/PocketTerm.xcconfig
    sources:
      - path: PocketTermLive
      - path: Shared/SessionActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKETTERM_BUNDLE_ID).PocketTermLive
        PRODUCT_NAME: PocketTermLive
        INFOPLIST_FILE: PocketTermLive/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
  PocketTermPush:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: ../../../config/PocketTerm.xcconfig
      Release: ../../../config/PocketTerm.xcconfig
    sources:
      - path: PocketTermPush
      - path: Shared/PocketTermShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKETTERM_BUNDLE_ID).PocketTermPush
        PRODUCT_NAME: PocketTermPush
        INFOPLIST_FILE: PocketTermPush/Info.plist
        CODE_SIGN_ENTITLEMENTS: PocketTermPush/PocketTermPush.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
  PocketTermTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: ../../../config/PocketTerm.xcconfig
      Release: ../../../config/PocketTerm.xcconfig
    sources:
      - path: PocketTermTests
    dependencies:
      - target: PocketTerm
      - package: PocketTermKit
        product: PocketTermKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKETTERM_BUNDLE_ID).Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PocketTerm.app/PocketTerm
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
