# A session that asks before running a command: the answer goes from the
# phone and the agent carries on. Where the terminal can't show its screen
# (Ghostty), the phone is told to answer on the computer instead (THEN).
#   env: SESSION (regex), ANSWER, THEN (regex)
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- runFlow:
    file: sub/open_row.yaml
    env:
      ROW: ${SESSION}
- extendedWaitUntil:
    visible: ${ANSWER}
    timeout: 20000
- takeScreenshot: asking
- tapOn: ${ANSWER}
- extendedWaitUntil:
    visible: ${THEN}
    timeout: 20000
- takeScreenshot: answered
- tapOn: "Back"
