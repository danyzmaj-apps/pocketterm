# Opens the list row whose first line is ROW (a regex), scrolling to it.
appId: com.danyzmaj.pocketterm
---
- scrollUntilVisible:
    element: "${ROW}\n.*"
    timeout: 20000
- tapOn: "${ROW}\n.*"
- waitForAnimationToEnd
# A tap while the list still moves (a row's age refreshed) can be lost.
- runFlow:
    when:
      notVisible: "Back"
    commands:
      - tapOn: "${ROW}\n.*"
      - waitForAnimationToEnd
