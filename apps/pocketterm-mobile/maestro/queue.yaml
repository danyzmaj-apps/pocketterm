# The demo's session at work ("Rate-limit the plant search") has prompts in its
# queue: its strip opens the whole queue over the screen, where a long prompt
# shows whole, one moves to the top, one is edited in place, one is added at
# the end, one is deleted and comes back with Undo, one is sent now and shows
# as Sent, and the queue pauses and resumes; then it closes. Needs the app
# signed out, as after a fresh install. Photographs each step
# (queue-<THEME>-*), so it can run once per theme (system, catppuccin,
# rosePine, tokyoNight) and appearance.
#   maestro test -e THEME=system queue.yaml
appId: com.danyzmaj.pocketterm
---
- launchApp:
    # iOS: a Debug build's test hooks (PocketTerm/Model/E2E.swift: tips seen, scripted speech).
    arguments:
      POCKETTERM_E2E: "true"
# Started in another theme (written to its preferences before launch), iOS says it changed the app's icon.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: ".*changed the icon.*"
          timeout: 3000
          optional: true
      - runFlow:
          when:
            visible: ".*changed the icon.*"
          commands:
            - tapOn:
                text: "OK"
                retryTapIfNoChange: false
- scrollUntilVisible:
    element: "Try the demo"
- tapOn: "Try the demo"
# A fresh install may ask first whether to have the first-use tips.
- extendedWaitUntil:
    visible: "No thanks"
    timeout: 2500
    optional: true
- tapOn:
    text: "No thanks"
    optional: true
- extendedWaitUntil:
    visible: ".*DEMO.*"
    timeout: 5000
- runFlow: tips.yaml
- tapOn: ".*Rate-limit the plant search.*"
- runFlow: tips.yaml
- extendedWaitUntil:
    visible: "Queued · 4"
    timeout: 5000
- takeScreenshot: queue-${THEME}-strip
- tapOn: "Queued · 4"
- extendedWaitUntil:
    visible: "(?i)queued · 4"
    timeout: 5000
- assertVisible: "(?i)working"
- assertVisible: "Show more"
- takeScreenshot: queue-${THEME}-open
- tapOn: "Show more"
- assertVisible: "Show less"
- takeScreenshot: queue-${THEME}-long
- tapOn: "Show less"
# The third, with its image, to the top.
- tapOn:
    id: "queue-menu-dq3"
- tapOn: "Move to top"
- waitForAnimationToEnd
- takeScreenshot: queue-${THEME}-moved
# Edited in place.
- tapOn: ".*Update the limits section of the docs.*"
- inputText: " And the changelog."
- takeScreenshot: queue-${THEME}-editing
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Save"
    timeout: 5000
- assertVisible: ".*Update the limits section of the docs. And the changelog.*"
# Added at the end.
- tapOn: "Add to the queue"
- inputText: "Then open a pull request."
- tapOn:
    id: "queue-add"
- extendedWaitUntil:
    visible: ".*Then open a pull request.*"
    timeout: 5000
# iOS: a scroll of the list puts the keyboard away (Maestro's hideKeyboard can't on a multi-line field).
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          from:
            id: "queue-list"
          direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- assertVisible: "(?i)queued · 5"
- takeScreenshot: queue-${THEME}-added
# Deleted, then back with Undo.
- tapOn:
    id: "queue-menu-dq1"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Undo"
    timeout: 5000
- assertNotVisible: ".*Add a test for the 429 answer.*"
- takeScreenshot: queue-${THEME}-deleted
# The toast slides in: tapped once it sits still.
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Undo"
- extendedWaitUntil:
    visible: ".*Add a test for the 429 answer.*"
    timeout: 5000
# Sent now: it leaves the queue, shown as Sent a moment.
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "queue-menu-dq3"
# Sent shows for only 1.5 s: the tap mustn't spend it waiting for the screen to settle. Even so, a tap and a
# look at the screen can outlast it (on iOS each takes a second or more), so the Sent row is only photographed
# when caught (the app's unit tests hold it); that the prompt went is checked.
- tapOn:
    text: "Send now"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "(?i)sent"
    timeout: 1500
    optional: true
- takeScreenshot: queue-${THEME}-sent
- extendedWaitUntil:
    notVisible: ".*This trace is from production.*"
    timeout: 5000
- assertVisible: "(?i)queued · 4"
# Paused and resumed.
- tapOn: "(?i)pause"
- extendedWaitUntil:
    visible: "(?i)paused"
    timeout: 5000
- takeScreenshot: queue-${THEME}-paused
- tapOn: "(?i)resume"
- extendedWaitUntil:
    visible: "(?i)working"
    timeout: 5000
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Add to the queue"
    timeout: 5000
- assertVisible: "Queued · 4"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Back"
- tapOn: "Exit demo"
- assertVisible: "Scan the code from your computer"
