# The page's Back. While typing on Android, the keyboard's own back (in the
# navigation bar) reads "Back" too: the keyboard goes first. Below Android 9
# the navigation bar's back reads Back as well, and the page's "Back\nBack"
# (its tooltip after its label): that one is tapped.
appId: com.danyzmaj.pocketterm
---
- runFlow:
    when:
      visible:
        id: "android:id/input_method_nav_back"
    commands:
      - hideKeyboard
# In this order: once one Back is tapped, the other's condition doesn't hold.
- runFlow:
    when:
      notVisible: "Back\nBack"
    commands:
      - tapOn: "Back"
- runFlow:
    when:
      visible: "Back\nBack"
    commands:
      - tapOn: "Back\nBack"
