# Notifications turned on later in the account sheet (Settings on Android)
# after Not now at sign-in, then off and on again; the sheet closes.
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- tapOn: "Account"
- extendedWaitUntil:
    visible: ".*Off: no notifications.*"
    timeout: 5000
- takeScreenshot: push-off
- runFlow:
    file: sub/switch.yaml
    env:
      ID: push-toggle
# Android 13+ asks for notifications: Allow. On iOS Maestro's driver answers
# the system's alert itself; a tap of ours on the Allow it saw would come after
# the alert has gone and land on the sheet (the switch), turning
# notifications off again.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Allow"
          optional: true
- extendedWaitUntil:
    visible: ".*Encrypted, through the push relay.*"
    timeout: 10000
- runFlow:
    file: sub/switch.yaml
    env:
      ID: push-toggle
- extendedWaitUntil:
    visible: ".*Off: no notifications.*"
    timeout: 10000
- runFlow:
    file: sub/switch.yaml
    env:
      ID: push-toggle
- extendedWaitUntil:
    visible: ".*Encrypted, through the push relay.*"
    timeout: 10000
- takeScreenshot: push-on
- runFlow: sub/close_account.yaml
- extendedWaitUntil:
    notVisible: "Leave this server"
    timeout: 5000
