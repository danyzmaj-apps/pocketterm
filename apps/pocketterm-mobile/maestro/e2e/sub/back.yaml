# The page's Back. iOS: the navigation bar's back button (its label is the
# page before's title). Android: the top bar's Back; while typing, the
# keyboard's own back (in the navigation bar) reads "Back" too: the keyboard
# goes first.
appId: com.danyzmaj.pocketterm
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible:
              id: "android:id/input_method_nav_back"
          commands:
            - hideKeyboard
      - tapOn: "Back"
