# A phone as after a fresh install: no sign-in, no keys, no tips seen (an E2E
# build starts them seen: lib/e2e_hooks.dart). The camera is denied (the
# Simulator has none; the scanner's paste field reads the code), photos
# allowed, notifications left for the app to ask.
appId: com.danyzmaj.pocketterm
---
- launchApp:
    # iOS: a Debug build's test hooks (PocketTerm/Model/E2E.swift: the scanner takes a pasted code, tips start
    # seen, scripted speech); Android's E2E build has them built in. POCKETTERM_E2E_FRESH: iOS drops the
    # preferences clearState leaves behind (the Simulator's preferences daemon keeps them).
    arguments:
      POCKETTERM_E2E: "true"
      POCKETTERM_E2E_FRESH: "true"
    clearState: true
    clearKeychain: true
    permissions:
      camera: deny
      photos: allow
      notifications: unset
- extendedWaitUntil:
    visible: "Welcome to PocketTerm"
    timeout: 30000
- takeScreenshot: setup
