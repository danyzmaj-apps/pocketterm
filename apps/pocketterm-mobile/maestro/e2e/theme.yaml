# Account → Theme: each theme in turn (sub/theme_pick.yaml photographs the
# theme sheet, the session list and a session in it), the choice still there
# after the app is stopped and started again, and Catppuccin Mocha last, the
# default the phone started on (picked first, it would change nothing).
#   env: SESSION (regex)
appId: com.danyzmaj.pocketterm
---
- runFlow:
    file: sub/theme_pick.yaml
    env:
      PICK: "Rosé Pine Dawn"
      NAME: dawn
- runFlow:
    file: sub/theme_pick.yaml
    env:
      PICK: "Tokyo Night"
      NAME: tokyo-night
- runFlow:
    file: sub/theme_pick.yaml
    env:
      PICK: "Gruvbox Material"
      NAME: gruvbox
# Kept: stopped and started again, the account sheet still says Gruvbox.
- stopApp
- runFlow: sub/home.yaml
- tapOn: "\n?Account"
- extendedWaitUntil:
    visible: "Theme\nGruvbox Material"
    timeout: 5000
- takeScreenshot: theme-gruvbox-relaunched
- runFlow:
    file: sub/theme_pick.yaml
    env:
      PICK: "Catppuccin Mocha"
      NAME: mocha
- stopApp
- runFlow: sub/home.yaml
- tapOn: "\n?Account"
- extendedWaitUntil:
    visible: "Theme\nCatppuccin Mocha"
    timeout: 5000
- tapOn:
    point: "50%,8%"
- extendedWaitUntil:
    notVisible: "Leave this server"
    timeout: 5000
