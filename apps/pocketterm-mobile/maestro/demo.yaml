# Opens the demo (made-up sessions, no server) from the setup screen and
# walks through it: a session, its approval, and back to setup. Needs the app
# signed out, as after a fresh install. A fresh install asks first whether to
# have the first-use tips: Show me, then they get "Got it" as they come.
#   maestro test demo.yaml
appId: com.danyzmaj.pocketterm
---
- launchApp
- scrollUntilVisible:
    element: "Try the demo"
- tapOn: "Try the demo"
# The tour question comes over the list first (an iOS sheet hides what's under it).
- extendedWaitUntil:
    visible: "Show me"
    timeout: 5000
    optional: true
- tapOn:
    text: "Show me"
    optional: true
# A tip's bubble over the list can hide the rest from the test until it's dismissed.
- runFlow: tips.yaml
- extendedWaitUntil:
    visible: ".*DEMO.*"
    timeout: 5000
# A row reads as its whole text. A tip's tour can take the first tap.
- tapOn: ".*Fix the pricing table on small screens.*"
- runFlow: tips.yaml
- runFlow:
    when:
      notVisible: "Approve"
    commands:
      - tapOn: ".*Fix the pricing table on small screens.*"
      - runFlow: tips.yaml
- tapOn: "Approve"
- extendedWaitUntil:
    visible: ".*Built in 6.2 s.*"
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Back"
- runFlow: tips.yaml
- tapOn: "Exit demo"
- assertVisible: "Scan the code from your computer"
