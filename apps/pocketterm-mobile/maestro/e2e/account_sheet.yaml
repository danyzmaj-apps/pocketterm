# The account sheet: its rows are there (notifications, tips, the source
# link, which isn't tapped), Leave this server asks first and Cancel keeps
# the sign-in; the sheet closes.
appId: com.danyzmaj.pocketterm
---
- runFlow: sub/home.yaml
- tapOn: "\n?Account"
- extendedWaitUntil:
    visible: "Leave this server"
    timeout: 5000
- assertVisible: "Signed in with your computer’s code"
- assertVisible: "Notifications\n.*"
- assertVisible: "Show tips again"
- assertVisible: "PocketTerm is open source: GitHub"
- takeScreenshot: account
- tapOn: "Leave this server"
- extendedWaitUntil:
    visible: "Leave this server\\?"
    timeout: 5000
- takeScreenshot: asking
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Leave this server\\?"
    timeout: 5000
# Still signed in, the sheet still open.
- assertVisible: "Leave this server"
- tapOn:
    point: "50%,8%"
- extendedWaitUntil:
    notVisible: "Leave this server"
    timeout: 5000
- assertVisible: "\n?New session"
- takeScreenshot: closed
